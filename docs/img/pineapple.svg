<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Say pineapple during a call and the last two minutes become a captured item">
  <defs>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif}
      .bar{animation:eq 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}.b5{animation-delay:.6s}.b6{animation-delay:.75s}.b7{animation-delay:.9s}
      @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
      .w1{opacity:0;animation:words 9s infinite}
      .w2{opacity:0;animation:words 9s infinite .9s}
      .w3{opacity:0;animation:pine 9s infinite 1.8s}
      @keyframes words{0%{opacity:0}6%,70%{opacity:1}78%,100%{opacity:0}}
      @keyframes pine{0%{opacity:0;transform:scale(.8)}6%{opacity:1;transform:scale(1.15)}10%,60%{opacity:1;transform:scale(1)}68%,100%{opacity:0}}
      .arrow{opacity:0;animation:arrow 9s infinite 2.6s}
      @keyframes arrow{0%{opacity:0}5%,58%{opacity:1}66%,100%{opacity:0}}
      .card{opacity:0;animation:card 9s infinite 3.2s}
      @keyframes card{0%{opacity:0;transform:translateX(-16px)}6%,54%{opacity:1;transform:none}62%,100%{opacity:0}}
    </style>
  </defs>
  <rect width="1000" height="300" rx="22" fill="#0a0b0e"/>

  <g class="t">
    <!-- mic + equaliser -->
    <g transform="translate(60 110)">
      <rect width="80" height="80" rx="40" fill="rgba(242,193,78,.12)" stroke="rgba(242,193,78,.4)"/>
      <g fill="#f2c14e">
        <rect class="bar b1" x="17" y="25" width="6" height="30" rx="3"/>
        <rect class="bar b2" x="27" y="18" width="6" height="44" rx="3"/>
        <rect class="bar b3" x="37" y="22" width="6" height="36" rx="3"/>
        <rect class="bar b4" x="47" y="15" width="6" height="50" rx="3"/>
        <rect class="bar b5" x="57" y="24" width="6" height="32" rx="3"/>
      </g>
      <text x="40" y="112" text-anchor="middle" font-size="13" fill="#6a675f">listening</text>
    </g>

    <!-- speech -->
    <g transform="translate(170 104)">
      <rect width="420" height="92" rx="16" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.1)"/>
      <text x="22" y="38" font-size="17" fill="#ebe8e1"><tspan class="w1">“Yeah, I'll get you the capacity </tspan><tspan class="w2">numbers</tspan></text>
      <text x="22" y="66" font-size="17" fill="#ebe8e1"><tspan class="w2">by Thursday — </tspan><tspan class="w3" font-weight="700" fill="#f2c14e">pineapple 🍍”</tspan></text>
    </g>

    <!-- arrow -->
    <g class="arrow">
      <path d="M605 150 H 655" stroke="#f2c14e" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M646 141 L 657 150 L 646 159" fill="none" stroke="#f2c14e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="630" y="132" text-anchor="middle" font-size="11" fill="#6a675f">triage</text>
    </g>

    <!-- captured card -->
    <g transform="translate(670 70)"><g class="card">
      <rect width="290" height="160" rx="16" fill="#15140f" stroke="rgba(242,193,78,.45)"/>
      <rect x="18" y="18" width="104" height="24" rx="12" fill="rgba(242,193,78,.14)"/>
      <text x="70" y="35" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#f2c14e">🍍 CAPTURED</text>
      <text x="18" y="72" font-size="16" font-weight="700" fill="#ebe8e1">Send Jordan the capacity</text>
      <text x="18" y="94" font-size="16" font-weight="700" fill="#ebe8e1">numbers · due Thu</text>
      <rect x="18" y="114" width="120" height="30" rx="8" fill="#f2c14e"/>
      <text x="78" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1508">Draft the email</text>
      <rect x="146" y="114" width="126" height="30" rx="8" fill="none" stroke="rgba(255,255,255,.15)"/>
      <text x="209" y="134" text-anchor="middle" font-size="13" fill="#ebe8e1">Mine, today</text>
    </g></g>

    <text x="500" y="276" text-anchor="middle" font-size="13" fill="#6a675f">Only the owner's 🍍 counts — triage reads the context. Gemini/Zoom/Otter notes get swept every 30 min as a backstop.</text>
  </g>
</svg>
