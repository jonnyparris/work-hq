<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Configuration layers: defaults, config file, environment, prompt overrides">
  <defs>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif}
      .m{font-family:"SF Mono",ui-monospace,Menlo,monospace}
      .h{font-size:17px;font-weight:700;fill:#ebe8e1}
      .s{font-size:12.5px;fill:#a19d94}
      .c{font-size:11.5px;fill:#6a675f}
      .card{animation:rise 8s infinite}
      .k2{animation-delay:.5s}.k3{animation-delay:1s}.k4{animation-delay:1.5s}
      @keyframes rise{0%,70%,100%{transform:translateY(0)}8%{transform:translateY(-6px)}16%{transform:translateY(0)}}
    </style>
  </defs>
  <rect width="1000" height="300" rx="22" fill="#0a0b0e"/>
  <g class="t">
    <text x="40" y="44" font-size="13" letter-spacing="2" fill="#6a675f">LATER WINS →</text>
    <g transform="translate(40 70)"><g class="card k1">
      <rect width="210" height="170" rx="16" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.12)"/>
      <text x="20" y="36" class="h">Defaults</text>
      <text x="20" y="60" class="s">generic, no company</text>
      <text x="20" y="78" class="s">anything in them</text>
      <text x="20" y="140" class="c m">src/server/config.ts</text>
      <text x="20" y="156" class="c m">prompts/*.md</text>
    </g></g>
    <g transform="translate(280 70)"><g class="card k2">
      <rect width="210" height="170" rx="16" fill="rgba(242,193,78,.07)" stroke="rgba(242,193,78,.4)"/>
      <text x="20" y="36" class="h">Config file</text>
      <text x="20" y="60" class="s">who you are, where</text>
      <text x="20" y="78" class="s">your notes live, projects</text>
      <text x="20" y="124" class="c m">$WORK_HQ_CONFIG</text>
      <text x="20" y="140" class="c m">./work-hq.config.json</text>
      <text x="20" y="156" class="c m" style="font-size:10.5px">~/.config/work-hq/config.json</text>
    </g></g>
    <g transform="translate(520 70)"><g class="card k3">
      <rect width="210" height="170" rx="16" fill="rgba(124,196,255,.06)" stroke="rgba(124,196,255,.35)"/>
      <text x="20" y="36" class="h">Environment</text>
      <text x="20" y="60" class="s">sandboxes, launchd,</text>
      <text x="20" y="78" class="s">one-off overrides</text>
      <text x="20" y="140" class="c m">WORK_HQ_PORT=7718</text>
      <text x="20" y="156" class="c m">WORK_HQ_SWEEPS=off</text>
    </g></g>
    <g transform="translate(760 70)"><g class="card k4">
      <rect width="200" height="170" rx="16" fill="rgba(123,216,143,.06)" stroke="rgba(123,216,143,.35)"/>
      <text x="20" y="36" class="h">Prompt overrides</text>
      <text x="20" y="60" class="s">your tools, your ticket</text>
      <text x="20" y="78" class="s">rules, your voice</text>
      <text x="20" y="140" class="c m">promptsDir/tools.md</text>
      <text x="20" y="156" class="c m">promptsDir/actions/*.md</text>
    </g></g>
    <text x="500" y="276" text-anchor="middle" font-size="13" fill="#6a675f">Check what got picked up: bin/work-hq config</text>
  </g>
</svg>
